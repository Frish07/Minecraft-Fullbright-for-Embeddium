name: Build and release Fullbright

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish a release for each supported Minecraft version
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Build and verify the Minecraft ports
        run: python ports/build.py
      - uses: actions/upload-artifact@v4
        with:
          name: Fullbright Minecraft JARs
          path: build/releases/
          if-no-files-found: error

  publish:
    if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: publish-fullbright-releases
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Fullbright Minecraft JARs
          path: build/releases
      - name: Publish in Minecraft release order
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash ports/publish.sh
